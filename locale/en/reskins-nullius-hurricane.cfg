[mod-name]
reskins-nullius-hurricane=Artisanal Reskins: Nullius Hurricane

[mod-description]
reskins-nullius-hurricane=Reskins items, entities, and technologies within Nullius to use Hurricane046's sprites, with tier colors and icon labeling. Forked from Nullius: Hurricane Reskins for Factorio 2.1; part of the Artisanal Reskins series.

[mod-setting-name]
reskins-nullius-hurricane-show-pipe-pictures=Show fluid connections

[mod-setting-description]
reskins-nullius-hurricane-show-pipe-pictures=When true, draws a pipe picture and cover for each fluid connection. When false, uses only the standard pipe cover.